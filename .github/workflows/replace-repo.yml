name: Replace Glow Cosmetics Site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate uploaded ZIP
        shell: bash
        run: |
          set -e

          echo "Files in repository:"
          ls -lah

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Glow Cosmetics ZIP was not found."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP"

          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Glow Cosmetics project
        shell: bash
        run: |
          set -e

          rm -rf /tmp/glow
          mkdir -p /tmp/glow

          echo "Extracting:"
          echo "$ZIP_PATH"

          unzip -q "$ZIP_PATH" -d /tmp/glow

          echo ""
          echo "Searching for package.json..."

          PROJECT=$(find /tmp/glow \
            -type f \
            -name "package.json" \
            -not -path "*/node_modules/*" \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Could not find the Glow Cosmetics project."
            echo ""
            find /tmp/glow -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo ""
          echo "FOUND PROJECT:"
          echo "$PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Remove old repository
        shell: bash
        run: |
          set -e

          echo "Removing old repository files..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

          echo "Old repository removed."

      - name: Copy new Glow Cosmetics site
        shell: bash
        run: |
          set -e

          echo "Copying:"
          echo "$PROJECT"

          cp -a "$PROJECT"/. .

          echo "New project copied."

      - name: Remove node_modules
        shell: bash
        run: |
          rm -rf node_modules

          echo "node_modules removed."
          echo "Dependencies will be installed by the hosting platform."

      - name: Remove ZIP
        shell: bash
        run: |
          find . -maxdepth 2 -type f -iname "*.zip" -delete

      - name: Verify project
        shell: bash
        run: |
          set -e

          echo "Checking project..."

          test -f package.json
          test -d src
          test -d public

          echo ""
          echo "package.json:"
          cat package.json

          echo ""
          echo "Product images:"
          find public/products -type f | wc -l

          echo ""
          echo "Project structure:"
          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            | sort | head -200

      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update Glow Cosmetics with 60 products"

      - name: Push changes
        shell: bash
        run: |
          set -e

          git push origin HEAD:main
