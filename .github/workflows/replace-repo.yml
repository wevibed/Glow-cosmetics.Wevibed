name: Finalize Glow Cosmetics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find project
        shell: bash
        run: |
          set -e

          echo "Searching for Glow Cosmetics project..."

          PROJECT=$(find . \
            -type f \
            -name "package.json" \
            -not -path "./.git/*" \
            -not -path "*/node_modules/*" \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          echo "Project found:"
          echo "$PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Verify project
        shell: bash
        run: |
          set -e

          echo "Checking:"
          echo "$PROJECT"

          test -f "$PROJECT/package.json"

          echo ""
          echo "package.json found."

          echo ""
          echo "Project contents:"
          find "$PROJECT" -maxdepth 2 -type f \
            ! -path "*/node_modules/*" \
            | sort | head -200

      - name: Create clean repository
        shell: bash
        run: |
          set -e

          echo "Creating clean temporary directory..."

          mkdir /tmp/glow-final

          cp -a "$PROJECT"/. /tmp/glow-final/

      - name: Remove old repository contents
        shell: bash
        run: |
          set -e

          echo "Removing old repository contents..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

      - name: Copy final Glow Cosmetics project
        shell: bash
        run: |
          set -e

          cp -a /tmp/glow-final/. .

          echo ""
          echo "Final repository structure:"
          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            ! -path "*/node_modules/*" \
            | sort | head -200

      - name: Remove node_modules
        shell: bash
        run: |
          find . -type d -name "node_modules" -prune -exec rm -rf {} +

      - name: Verify final project
        shell: bash
        run: |
          set -e

          echo "Verifying final project..."

          test -f package.json
          test -d src

          echo ""
          echo "SUCCESS"
          echo ""
          echo "package.json:"
          cat package.json

          echo ""
          echo "Source files:"
          find src -type f | wc -l

          echo ""
          echo "Public files:"
          if [ -d public ]; then
            find public -type f | wc -l
          fi

      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Finalize Glow Cosmetics 60-product catalogue"

      - name: Push to main
        shell: bash
        run: |
          set -e

          git push origin HEAD:main
