name: Replace Repository With Final Nyarie Glow Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract final repo
        id: extract
        shell: bash
        run: |
          set -e

          rm -rf /tmp/nyarie-final
          mkdir -p /tmp/nyarie-final

          unzip -q "${{ steps.zip.outputs.zip }}" -d /tmp/nyarie-final

          PACKAGE=$(find /tmp/nyarie-final -name package.json -type f | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PACKAGE")

          echo "Project root:"
          echo "$PROJECT_ROOT"

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Remove old repository files
        shell: bash
        run: |
          set -e

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

          echo "Old repository removed."

      - name: Copy final Nyarie Glow project
        shell: bash
        run: |
          set -e

          PROJECT_ROOT="${{ steps.extract.outputs.project_root }}"

          cp -a "$PROJECT_ROOT"/. .

          echo "New project copied successfully."

      - name: Remove uploaded ZIP
        shell: bash
        run: |
          rm -f *.zip

      - name: Verify repository
        shell: bash
        run: |
          set -e

          test -f package.json
          test -f index.html

          echo "package.json found."
          echo "index.html found."

          echo ""
          echo "Repository:"
          ls -la

      - name: Commit and push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Nyarie Glow WhatsApp and cart checkout"

          git push

          echo "FINAL REPO DEPLOYED TO MAIN."
