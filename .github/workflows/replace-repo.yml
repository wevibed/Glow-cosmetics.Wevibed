name: Replace Repository With ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q "${{ steps.zip.outputs.zip }}" -d extracted

          echo "Extracted contents:"
          find extracted -maxdepth 2 -type f | head -100

      - name: Locate project root
        shell: bash
        run: |
          if [ -f "extracted/package.json" ]; then
            echo "Project is at extracted/"
            echo "PROJECT_ROOT=extracted" >> "$GITHUB_ENV"
          else
            PROJECT_DIR=$(find extracted -mindepth 1 -maxdepth 2 -name package.json -printf '%h\n' | head -n 1)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Could not find package.json in ZIP."
              exit 1
            fi

            echo "Project found at: $PROJECT_DIR"
            echo "PROJECT_ROOT=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Remove old repository files
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name "extracted" \
            ! -name "$(basename "${{ steps.zip.outputs.zip }}")" \
            -exec rm -rf {} +

      - name: Copy new project
        shell: bash
        run: |
          cp -a "$PROJECT_ROOT"/. .

      - name: Remove ZIP and temporary files
        shell: bash
        run: |
          rm -rf extracted
          rm -f *.zip

      - name: Show final structure
        shell: bash
        run: |
          echo "Final repository:"
          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            | sort | head -200

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Replace site with updated Glow Cosmetics catalogue"
          git push
