name: Replace Repository With ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            echo ""
            echo "Files currently in repository:"
            ls -la
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Inspect ZIP
        shell: bash
        run: |
          set -e

          echo "ZIP contents:"
          unzip -l "${{ steps.find_zip.outputs.zip_file }}"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf /tmp/glow-extracted
          mkdir -p /tmp/glow-extracted

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" \
            -d /tmp/glow-extracted

          echo "Extraction complete."

          echo "Top-level contents:"
          find /tmp/glow-extracted -maxdepth 2 -type f | head -100

      - name: Locate project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_ROOT=""

          # Case 1: package.json is directly in extracted folder
          if [ -f "/tmp/glow-extracted/package.json" ]; then
            PROJECT_ROOT="/tmp/glow-extracted"
          fi

          # Case 2: ZIP contains one project folder
          if [ -z "$PROJECT_ROOT" ]; then
            PROJECT_ROOT=$(find /tmp/glow-extracted \
              -mindepth 1 \
              -maxdepth 3 \
              -type f \
              -name "package.json" \
              -printf '%h\n' \
              | head -n 1)
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: package.json was not found."
            echo ""
            echo "Extracted files:"
            find /tmp/glow-extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Project root:"
          echo "$PROJECT_ROOT"

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Remove old site
        shell: bash
        run: |
          set -e

          echo "Removing old repository contents..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

          echo "Old site removed."

      - name: Copy new site
        shell: bash
        run: |
          set -e

          PROJECT_ROOT="${{ steps.project.outputs.project_root }}"

          echo "Copying new Glow Cosmetics site..."

          cp -a "$PROJECT_ROOT"/. .

          echo "New site copied."

      - name: Remove uploaded ZIP
        shell: bash
        run: |
          rm -f ./*.zip

      - name: Verify new repository
        shell: bash
        run: |
          set -e

          echo "Checking new project..."

          if [ ! -f "package.json" ]; then
            echo "ERROR: package.json missing after replacement."
            exit 1
          fi

          echo ""
          echo "package.json found."

          echo ""
          echo "Project files:"
          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            | sort \
            | head -200

      - name: Commit replacement
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update Glow Cosmetics catalogue with 60 products"

      - name: Push changes
        shell: bash
        run: |
          set -e

          git push origin HEAD
