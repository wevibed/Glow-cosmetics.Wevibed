name: Replace Repository With Final Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract final repository
        id: extract
        shell: bash
        run: |
          set -e

          rm -rf /tmp/glow-final
          mkdir -p /tmp/glow-final

          unzip -q "${{ steps.zip.outputs.zip }}" -d /tmp/glow-final

          echo "ZIP extracted successfully."

          PACKAGE=$(find /tmp/glow-final -name package.json -type f | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PACKAGE")

          echo "Project root:"
          echo "$PROJECT_ROOT"

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Remove old repository files
        shell: bash
        run: |
          set -e

          echo "Removing old repository files..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

          echo "Old repository files removed."

      - name: Copy final repository
        shell: bash
        run: |
          set -e

          PROJECT_ROOT="${{ steps.extract.outputs.project_root }}"

          echo "Copying final project from:"
          echo "$PROJECT_ROOT"

          cp -a "$PROJECT_ROOT"/. .

          echo "Final project copied."

      - name: Remove uploaded ZIP
        shell: bash
        run: |
          set -e

          rm -f *.zip

          echo "Uploaded ZIP removed."

      - name: Verify final repository
        shell: bash
        run: |
          set -e

          echo "Checking final repository..."

          test -f package.json
          test -f index.html

          echo "package.json: OK"
          echo "index.html: OK"

          echo ""
          echo "Repository root:"
          ls -la

      - name: Commit replacement
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Replace site with Nyarie Glow Cosmetics Wholesale final build"

          git push

          echo "Repository replacement completed successfully."
