name: Extract Project ZIP

on: push

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP_FILE=$(find . -type f -name "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found anywhere in the repository."
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          cp -a extracted/. .

          rm -rf extracted "$ZIP_FILE"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract project from ZIP" || echo "Nothing to commit"
          git push
